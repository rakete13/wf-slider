<!-- WF Slider · Head Code -->
<script>
document.documentElement.classList.add('js-slider');
setTimeout(function(){if(!window.WFSlider)document.documentElement.classList.remove('js-slider')},3000);
</script>
<style>
[data-slider]{min-width:0}
.js-slider [data-slider="fade"]:not(.wfs-off) :is([data-slider-track],.w-dyn-items){display:grid}
.js-slider [data-slider="fade"]:not(.wfs-off) :is([data-slider-track],.w-dyn-items)>*{grid-area:1/1/2/2}
.js-slider [data-slider="fade"]:not(.wfs-off) :is([data-slider-track],.w-dyn-items)>:not(:first-child){opacity:0;visibility:hidden}
.js-slider [data-slider]:not(.wfs-off) [data-slider-anim]{opacity:0}
</style>
